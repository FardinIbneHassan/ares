<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal lost · ARES</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0e10">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@600;700&display=swap">
  <!--
    GitHub Pages serves this file for ANY missing URL, including deep ones like /a/b/c,
    so relative links to css/ or index.html would break here. That's why this page is
    self-contained (inline styles) and uses SITE_ROOT below.

    SITE_ROOT:
      - "/"                if the site lives at  https://solaris-tech.github.io/
      - "/solaris-tech/"   if the site lives at  https://<username>.github.io/solaris-tech/
  -->
  <script>window.SITE_ROOT = "/";</script>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;padding:2rem;background:#0d0e10;color:#e6e3dd;font-family:"JetBrains Mono",ui-monospace,monospace;text-align:center;overflow:hidden}
    body::before{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(230,227,221,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(230,227,221,.06) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(circle at 50% 50%,#000 10%,transparent 65%);-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 10%,transparent 65%)}
    .planet{width:120px;height:120px;margin:0 auto 2.5rem;border-radius:50%;background:radial-gradient(circle at 35% 35%,#cf8a70,#b4674d 45%,#3a1f17);box-shadow:0 0 60px rgba(180,103,77,.35);position:relative;animation:float 6s ease-in-out infinite}
    .planet::after{content:"";position:absolute;inset:-14px -40px;border:1px dashed rgba(201,184,154,.4);border-radius:50%;transform:rotate(-20deg) scaleY(.35)}
    .code{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(4rem,12vw,8rem);line-height:1;letter-spacing:.08em;margin:0;animation:glitch 3s steps(1) infinite}
    p{color:#8a8f98;letter-spacing:.06em;margin:1rem 0 2rem}
    .label{color:#cf8a70;font-size:.75rem;letter-spacing:.25em;text-transform:uppercase}
    a{display:inline-block;padding:.9rem 1.4rem;border:1px solid #b4674d;border-radius:4px;color:#e6e3dd;text-decoration:none;text-transform:uppercase;letter-spacing:.1em;font-size:.85rem;transition:background .3s,color .3s}
    a:hover,a:focus-visible{background:#b4674d;color:#0d0e10}
    @keyframes float{50%{transform:translateY(-10px)}}
    @keyframes glitch{0%,92%,100%{transform:none;text-shadow:none}93%{transform:translateX(3px);text-shadow:-3px 0 #5f9ea0,3px 0 #b4674d}96%{transform:translateX(-2px);text-shadow:2px 0 #5f9ea0,-2px 0 #b4674d}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body>
  <main>
    <div class="planet" aria-hidden="true"></div>
    <span class="label">Error · signal lost</span>
    <h1 class="code">404</h1>
    <p>This page drifted out of orbit. Let's get you back to base.</p>
    <a id="home-link" href="/">Return to base →</a>
  </main>
  <script>document.getElementById("home-link").href = window.SITE_ROOT || "/";</script>
</body>
</html>
